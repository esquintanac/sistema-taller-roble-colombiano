    <!-- Tipografías del sistema, las mismas del diseño de referencia:

         genéricas y el diseño no coincidía con el prototipo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Lato:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Iconos del hero de autenticación: la misma versión CDN de Font
         Awesome 6.5.1 que usa el prototipo (frontend/index.html). -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <title>Taller del Roble Colombiano</title>
  </head>
